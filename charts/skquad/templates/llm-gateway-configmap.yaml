  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
data:
  config.yaml: |
    {{- .Values.llmGateway.config | nindent 4 }}
