{{- if not .Values.llmGateway.masterKeySecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skquad.llmGatewayMasterKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
type: Opaque
stringData:
  {{ .Values.llmGateway.masterKeySecret.key }}: {{ .Values.llmGateway.masterKey | quote }}
{{- end }}
