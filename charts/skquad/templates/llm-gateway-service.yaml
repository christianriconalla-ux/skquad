apiVersion: v1
kind: Service
metadata:
  name: {{ include "skquad.llmGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skquad.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
spec:
  type: ClusterIP
  selector:
    {{- include "skquad.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
  ports:
    - name: http
      port: {{ .Values.llmGateway.port }}
      targetPort: http
      protocol: TCP
