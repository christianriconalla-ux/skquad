apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: squads.skquad.io
spec:
  group: skquad.io
  names:
    kind: Squad
    listKind: SquadList
    plural: squads
    singular: squad
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - ownerRef
                - squadId
              properties:
                squadId:
                  type: string
                ownerRef:
                  type: string
                namespace:
                  type: string
                mission:
                  type: string
                operatingModel:
                  x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
            status:
              type: object
              properties:
                namespace:
                  type: string
                ready:
                  type: boolean
                phase:
                  type: string
                reason:
                  type: string
                updatedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
