# Default values for the skquad Helm chart.
# See docs/deployment-operator.md §6 for the full chart layout.
image:
  apiServer:
    repository: skquad/api-server
    tag: "0.1.0"
  operator:
    repository: skquad/operator
    tag: "0.1.0"
  llmGateway:
    repository: skquad/llm-gateway
    tag: "0.1.0"
  agentRuntime:
    repository: skquad/agent-runtime
    tag: "0.1.0"
  web:
    repository: skquad/web
    tag: "0.1.0"

replicas:
  apiServer: 2
  llmGateway: 2
  operator: 1
  web: 1

namespace:
  create: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  imagePullPolicy: IfNotPresent
  existingSecret: ""
  secretKeys:
    database: database
    username: username
    password: password
    databaseUrl: database-url
  database: skquad
  user: skquad
  password: skquad-dev-password
  storage:
    size: 10Gi
  resources: {}

observability:
  enabled: false   # toggle Prometheus metrics (see docs/observability-metering.md)

agent:
  idleTimeout: 300s
  taskPollIntervalSeconds: "5"
  inboxPollIntervalSeconds: "5"
  inboxBatchSize: "5"

operator:
  leaderElection: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  imagePullPolicy: IfNotPresent
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

apiServer:
  imagePullPolicy: IfNotPresent
  authMode: dev
  databaseUrl: ""
  runtimeControlPlaneUrl: ""
  runtimeLlmGatewayUrl: ""
  databaseUrlSecret:
    name: ""
    key: database-url
  oidc:
    issuer: ""
    audience: ""
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

llmGateway:
  imagePullPolicy: IfNotPresent
  port: 4000
  config: |
    model_list: []
    litellm_settings:
      success_callback: []
  resources: {}

web:
  imagePullPolicy: IfNotPresent
  port: 3000
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skquad.local
      paths:
        - path: /api
          pathType: Prefix
          service: apiServer
        - path: /
          pathType: Prefix
          service: web
  tls: []
