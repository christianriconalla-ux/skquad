[project]
name = "skquad-agent-runtime"
version = "0.1.0"
description = "skquad agent harness: thin custom runtime + LiteLLM + plugin interface"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
]

[project.scripts]
skquad-agent-runtime = "skquad_runtime.runtime:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
