# LiteLLM proxy configuration for the skquad LLM gateway.
#
# The gateway is the single, model-agnostic endpoint all agent LLM calls flow
# through. It meters tokens, computes cost, enforces agent permissions, and
# routes BYOM calls. See docs/llm-gateway.md.
#
# The Helm chart injects this config by default. Keep model_list empty in local
# development unless a provider is explicitly configured.
model_list: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
litellm_settings:
  drop_params: true
  overwrite_user_with_key_hash: true
  callbacks: skquad_litellm_callbacks.proxy_handler_instance
  success_callback: []
